apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-smoke-k6-script
  namespace: weather-staging
  labels:
    app: keda-smoke
data:
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      stages: [
        { duration: '30s', target: 20 },
        { duration: '3m', target: 100 },
        { duration: '3m', target: 100 },
        { duration: '1m', target: 0 },
      ],
      thresholds: {
        http_req_failed: ['rate<0.1'],
      },
    };

    const BASE_URL = 'http://weather-api.weather-staging.svc.cluster.local:8080';

    export default function () {
      const res = http.get(`${BASE_URL}/weather?latitude=10.78&longitude=106.70`);
      check(res, {
        'status is 200': (r) => r.status === 200,
      });
      sleep(0.1);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keda-smoke-load
  namespace: weather-staging
  labels:
    app: keda-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 720
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: keda-smoke
        job-name: keda-smoke
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          command:
            - k6
            - run
            - /scripts/script.js
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: k6-script
          configMap:
            name: keda-smoke-k6-script
