---
# cloud-nuke v0.50 configuration for max-weather infrastructure cleanup.
# Destroys all resources created by this project, including bootstrap
# (Terraform state S3 bucket + DynamoDB lock table).
#
# Resource naming conventions covered:
#   - Bootstrap:  <project>-tfstate-<account-id>, <project>-tflock
#                 where <project> defaults to "max-weather"
#   - Workload:   <env>-<project>-* (master_prefix), e.g. "poc-max-weather-*"
#   - ECR repos:  *weather-api*, *max-weather*
#   - Secrets:    poc-max-weather-authorizer-jwt-secret,
#                 /poc-max-weather/app/config
#   - Log groups: /aws/eks/poc-max-weather/*, /aws/apigateway/poc-max-weather-api,
#                 /aws/ec2/poc-max-weather-jenkins, /aws/lambda/poc-max-weather-*
#   - EKS-module derived (terraform-aws-modules/eks): KMS keys/aliases,
#     SQS karpenter queue, Karpenter IAM roles/instance profiles, OIDC provider.
#
# Schema reference (v0.50):
#   https://github.com/gruntwork-io/cloud-nuke/blob/v0.50.0/config/config.go

# ─── Compute ────────────────────────────────────────────────────────────────

EC2:
  include:
    names_regex:
      - ".*max-weather.*"

EC2DedicatedHosts:
  include:
    names_regex:
      - ".*max-weather.*"

SecurityGroup:
  include:
    names_regex:
      - ".*max-weather.*"

EBSVolume:
  include:
    names_regex:
      - ".*max-weather.*"

EC2KeyPairs:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Networking ─────────────────────────────────────────────────────────────

VPC:
  include:
    names_regex:
      - ".*max-weather.*"

NATGateway:
  include:
    names_regex:
      - ".*max-weather.*"

ElasticIP:
  include:
    names_regex:
      - ".*max-weather.*"

ELBv1:
  include:
    names_regex:
      - ".*max-weather.*"

ELBv2:
  include:
    names_regex:
      - ".*max-weather.*"

EC2Endpoint:
  include:
    names_regex:
      - ".*max-weather.*"
      - ".*vpce-${PROJECT}.*"

EC2Subnet:
  include:
    names_regex:
      - ".*max-weather.*"

NetworkInterface:
  include:
    names_regex:
      - ".*max-weather.*"

InternetGateway:
  include:
    names_regex:
      - ".*max-weather.*"

RouteTable:
  include:
    names_regex:
      - ".*max-weather.*"

NetworkACL:
  include:
    names_regex:
      - ".*max-weather.*"

EgressOnlyInternetGateway:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Container / Serverless ─────────────────────────────────────────────────

EKSCluster:
  include:
    names_regex:
      - ".*max-weather.*"

ECRRepository:
  include:
    names_regex:
      - ".*weather-api.*"
      - ".*max-weather.*"

LambdaFunction:
  include:
    names_regex:
      - ".*max-weather.*"

LambdaLayer:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── API Gateway ────────────────────────────────────────────────────────────

APIGateway:
  include:
    names_regex:
      - ".*max-weather.*"

APIGatewayV2:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Identity / Access ──────────────────────────────────────────────────────

IAMRoles:
  include:
    names_regex:
      - ".*max-weather.*"
  exclude:
    names_regex:
      - "^OrganizationAccountAccessRole$"
      - "^AWSServiceRole.*"

IAMPolicies:
  include:
    names_regex:
      - ".*max-weather.*"

IAMGroups:
  include:
    names_regex:
      - ".*max-weather.*"

IAMUsers:
  include:
    names_regex:
      - ".*max-weather.*"

IAMServiceLinkedRoles:
  include:
    names_regex:
      - ".*max-weather.*"

IAMInstanceProfiles:
  include:
    names_regex:
      - ".*max-weather.*"

OIDCProvider:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Secrets / Crypto ───────────────────────────────────────────────────────

SecretsManager:
  include:
    names_regex:
      - ".*max-weather.*"

SSMParameter:
  include:
    names_regex:
      - ".*max-weather.*"

KMSCustomerKeys:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Messaging ──────────────────────────────────────────────────────────────

SQS:
  include:
    names_regex:
      - ".*max-weather.*"

SNS:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Storage (bootstrap state lives here) ───────────────────────────────────

S3:
  include:
    names_regex:
      - ".*max-weather.*"
      - ".*-tfstate-[0-9]+$"

DynamoDB:
  include:
    names_regex:
      - ".*max-weather.*"
      - ".*-tflock$"

ElasticFileSystem:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Observability ──────────────────────────────────────────────────────────

CloudWatchLogGroup:
  include:
    names_regex:
      - ".*/max-weather/.*"
      - ".*max-weather.*"
      - "^/aws/eks/.*max-weather.*"
      - "^/aws/lambda/.*max-weather.*"
      - "^/aws/apigateway/.*max-weather.*"
      - "^/aws/ec2/.*max-weather.*"

CloudWatchAlarm:
  include:
    names_regex:
      - ".*max-weather.*"

CloudWatchDashboard:
  include:
    names_regex:
      - ".*max-weather.*"

# ─── Auto Scaling / Karpenter (EKS module derived) ──────────────────────────

AutoScalingGroup:
  include:
    names_regex:
      - ".*max-weather.*"

LaunchTemplate:
  include:
    names_regex:
      - ".*max-weather.*"

LaunchConfiguration:
  include:
    names_regex:
      - ".*max-weather.*"
