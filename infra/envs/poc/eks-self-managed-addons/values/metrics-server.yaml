# metrics-server Helm values
# Chart: https://kubernetes-sigs.github.io/metrics-server (metrics-server 3.12.1)
# Namespace: kube-system
defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  - --metric-resolution=15s
nodeSelector:
  role: infra
tolerations:
  - key: role
    operator: Equal
    value: infra
    effect: NoSchedule
