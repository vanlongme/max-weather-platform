# ClusterSecretStore wired to AWS Secrets Manager via EKS Pod Identity.
# Applied by scripts/install-helm-addons.sh after the external-secrets release is healthy.
# The external-secrets controller pod inherits the Pod Identity association
# (namespace=external-secrets, sa=external-secrets) created by infra/modules/eks,
# so no explicit auth block is required here.
# Templated values (must be substituted by install script):
#   ${AWS_REGION} - AWS region
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
