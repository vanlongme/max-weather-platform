## EC2NodeClass: AWS-specific node configuration for Karpenter (v1 API).
##
## OS: Bottlerocket (container-optimized; matches EKS managed node group AMI).
##   - /dev/xvda: 4Gi OS volume (Bottlerocket os partition; minimum 4Gi)
##   - /dev/xvdb: 60Gi data volume (containerd images + ephemeral pod storage)
##
## Pod Identity: requires IMDSv2 hop limit >= 2 so the EKS Pod Identity Agent
## (DaemonSet on each node) can reach the local credentials endpoint via the
## node's IMDS. Karpenter-provisioned nodes inherit the standard EKS pod
## identity association; no extra config needed beyond the metadataOptions
## block below.
##
## Discovers subnets and security groups by tag (set on the EKS module).
## envsubst variables:
##   ${CLUSTER_NAME}                       - terraform output: cluster_name
##   ${KARPENTER_NODE_IAM_ROLE_NAME}       - terraform output: karpenter_node_iam_role_name
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - alias: bottlerocket@latest
  role: ${KARPENTER_NODE_IAM_ROLE_NAME}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  blockDeviceMappings:
    # Bottlerocket OS partition (read-only root, minimum 4Gi)
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 4Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
    # Bottlerocket data partition (containerd images + ephemeral pod storage)
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: 60Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  # Bottlerocket-specific user data: enable kernel.unprivileged_userns_clone
  # and admin container for break-glass debugging via SSM.
  userData: |
    [settings.kernel.sysctl]
    "kernel.unprivileged_userns_clone" = "1"
    [settings.host-containers.admin]
    enabled = false
    [settings.host-containers.control]
    enabled = true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    # hop limit 2 required for EKS Pod Identity Agent (pod -> node IMDS).
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    karpenter.sh/discovery: ${CLUSTER_NAME}
    Project: max-weather
    ManagedBy: karpenter
