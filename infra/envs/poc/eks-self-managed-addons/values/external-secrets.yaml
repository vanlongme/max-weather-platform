# external-secrets Helm values
# Chart: https://charts.external-secrets.io (external-secrets 0.10.4)
# Namespace: external-secrets (created by install script)
#
# IAM: bound via EKS Pod Identity (namespace=external-secrets, sa=external-secrets).
# Association created by infra/modules/eks; no SA annotation required.
installCRDs: true
replicaCount: 1
serviceAccount:
  create: true
  name: external-secrets
nodeSelector:
  role: infra
tolerations:
  - key: role
    operator: Equal
    value: infra
    effect: NoSchedule
webhook:
  nodeSelector:
    role: infra
  tolerations:
    - key: role
      operator: Equal
      value: infra
      effect: NoSchedule
certController:
  nodeSelector:
    role: infra
  tolerations:
    - key: role
      operator: Equal
      value: infra
      effect: NoSchedule
