# ingress-nginx Helm values
# Chart: https://kubernetes.github.io/ingress-nginx (ingress-nginx 4.11.3)
# Namespace: ingress-nginx (created by install script)
controller:
  replicaCount: 3
  ingressClassResource:
    name: nginx
    default: true
  service:
    type: LoadBalancer
    # externalTrafficPolicy=Cluster is REQUIRED with the in-tree AWS cloud
    # provider NLB integration (no AWS LBC installed). The annotation
    # `aws-load-balancer-nlb-target-type: ip` is silently IGNORED by the
    # in-tree provisioner — it always creates instance-mode targets, which
    # combined with ETP=Local + the NLB ENI sharing a subnet with workload
    # pods triggers an SNAT/hairpin black-hole (TCP connect OK, no HTTP
    # response). ETP=Cluster routes via kube-proxy SNAT, removing the
    # hairpin; source IP preservation is sacrificed (acceptable for the POC).
    externalTrafficPolicy: Cluster
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      # Legacy annotation required by in-tree AWS cloud-provider NLB integration
      # (used here — AWS Load Balancer Controller is NOT installed). Without
      # this, in-tree provisioner ignores `aws-load-balancer-scheme` and creates
      # internet-facing NLB by default. The modern annotation above is kept for
      # forward-compatibility with AWS LBC migration.
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      # preserve_client_ip.enabled=false is REQUIRED on instance-mode NLB targets
      # to avoid the same-node SNAT hairpin (client SYN reaches NLB → ENI → back
      # to the originating node → kube-proxy SNATs → reply src=node IP ≠ original
      # client IP, dropped). With ETP=Cluster the source IP is already lost; this
      # only removes the broken-path symptom.
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=false
  # Spread replicas one-per-AZ so every NLB AZ-zonal IP has a local pod and
  # passes NLB target health checks.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/instance: ingress-nginx
          app.kubernetes.io/component: controller
  config:
    use-forwarded-headers: "true"
    enable-real-ip: "true"
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector:
    role: infra
  tolerations:
    - key: role
      operator: Equal
      value: infra
      effect: NoSchedule
  admissionWebhooks:
    patch:
      nodeSelector:
        role: infra
      tolerations:
        - key: role
          operator: Equal
          value: infra
          effect: NoSchedule
