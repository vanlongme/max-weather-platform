# cluster-autoscaler Helm values
# Chart: https://kubernetes.github.io/autoscaler (cluster-autoscaler 9.37.0)
# Namespace: kube-system
# Templated values (must be substituted by install script):
#   ${CLUSTER_NAME}  - EKS cluster name
#   ${AWS_REGION}    - AWS region
#
# IAM: bound via EKS Pod Identity (namespace=kube-system, sa=cluster-autoscaler).
# Association created by infra/modules/eks; no SA annotation required.
autoDiscovery:
  clusterName: ${CLUSTER_NAME}
awsRegion: ${AWS_REGION}
rbac:
  serviceAccount:
    name: cluster-autoscaler
extraArgs:
  scale-down-delay-after-add: 5m
  scale-down-unneeded-time: 5m
  balance-similar-node-groups: "true"
  skip-nodes-with-system-pods: "false"
