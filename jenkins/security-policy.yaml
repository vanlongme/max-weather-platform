---
# jenkins/security-policy.yaml
# Central security gate configuration — single source of truth for all scan
# modes and thresholds.
#
# To flip a scan from advisory → blocking:
#   1. Change `mode: advisory` to `mode: blocking` for the desired scan key.
#   2. Commit and push to main.
#   3. The next CI build picks up the change automatically.
#
# Suppression entries (allowlist_file) have NO TTL — they accumulate
# indefinitely by design.
# Format refs:
#   gitleaks: https://github.com/gitleaks/gitleaks#configuration
#   trivy severity:
#     https://aquasecurity.github.io/trivy/latest/docs/configuration/
#     filtering/#by-severity
#   semgrep rulesets: https://semgrep.dev/explore
version: 1
scans:
  secrets:
    tool: gitleaks
    mode: advisory
    severity_threshold: any
    allowlist_file: .gitleaks.toml
  sast:
    tool: semgrep
    mode: advisory
    severity_threshold: "ERROR,WARNING"
    rulesets:
      - p/nodejs
      - p/owasp-top-ten
      - p/javascript
    allowlist_file: .semgrepignore
  sca_npm:
    tool: npm-audit
    mode: blocking
    severity_threshold: high
    production_only: true
  container:
    tool: trivy-img
    mode: advisory
    severity_threshold: "HIGH,CRITICAL"
    allowlist_file: .trivyignore
    ignore_unfixed: true
notifications:
  target: jenkins_ui
