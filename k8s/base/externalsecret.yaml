apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-app-config
  labels:
    app: weather-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: weather-app-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /poc-max-weather/app/config
