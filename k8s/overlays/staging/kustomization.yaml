apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: weather-staging

resources:
  - ../../base

images:
  - name: weather-api
    newName: PLACEHOLDER_ECR_URL
    newTag: staging-latest

patches:
  - path: serviceaccount-patch.yaml
    target:
      kind: ServiceAccount
      name: weather-api
  - path: externalsecret-patch.yaml
    target:
      kind: ExternalSecret
      name: weather-app-config
