# aws-load-balancer-controller Helm values
# Chart: https://aws.github.io/eks-charts (aws-load-balancer-controller 1.8.2)
# Namespace: kube-system
# Templated values (must be substituted by install script):
#   ${CLUSTER_NAME}  - EKS cluster name
#   ${AWS_REGION}    - AWS region
#   ${VPC_ID}        - VPC ID (terraform output: vpc_id)
#
# IAM: bound via EKS Pod Identity (namespace=kube-system, sa=aws-load-balancer-controller).
# Association created by infra/modules/eks; no SA annotation required.
clusterName: ${CLUSTER_NAME}
region: ${AWS_REGION}
vpcId: ${VPC_ID}
replicaCount: 2
serviceAccount:
  create: true
  name: aws-load-balancer-controller
