## EC2NodeClass: AWS-specific node configuration for Karpenter (v1 API).
## Discovers subnets and security groups by tag (set on the EKS module).
## envsubst variables:
##   ${CLUSTER_NAME}                       - terraform output: cluster_name
##   ${KARPENTER_NODE_IAM_ROLE_NAME}       - terraform output: karpenter_node_iam_role_name
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: ${KARPENTER_NODE_IAM_ROLE_NAME}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    karpenter.sh/discovery: ${CLUSTER_NAME}
    Project: max-weather
    ManagedBy: karpenter
