# ClusterSecretStore wired to AWS Secrets Manager via IRSA.
# Applied by scripts/install-helm-addons.sh after the external-secrets release is healthy.
# Templated values (must be substituted by install script):
#   ${AWS_REGION} - AWS region
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
