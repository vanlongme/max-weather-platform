# .zap/baseline.conf — OWASP ZAP baseline scan ignore rules
# Format: https://www.zaproxy.org/docs/docker/baseline-scan/#configuration-file
# Entries have NO TTL — they accumulate indefinitely by design.
# Add entries ONLY with a comment explaining: Alert ID, alert name, justification, date added.
#
# Rule format: WARN|IGNORE|FAIL <alert-id>  <description>
# WARN  = report but do not fail (advisory behavior)
# IGNORE = completely suppress
# FAIL  = treat as blocking regardless of policy (use sparingly)
#
# Example:
# IGNORE 10035  # Strict-Transport-Security missing — not applicable behind API Gateway (HTTPS enforced at edge) | 2025-01-01
